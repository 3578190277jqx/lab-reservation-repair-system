name: lab-management

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/lab-mysql-entrypoint.sh"]
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: lab_management
      MYSQL_USER: lab_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      INITIAL_ADMIN_PASSWORD_HASH: ${INITIAL_ADMIN_PASSWORD_HASH:?Generate and set INITIAL_ADMIN_PASSWORD_HASH in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
      - ./deploy/mysql-entrypoint.sh:/usr/local/bin/lab-mysql-entrypoint.sh:ro
    healthcheck:
      # Use TCP: the image's temporary initialization server accepts only sockets.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --batch --skip-column-names
          --execute='SELECT 1'
          | grep -qx 1
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 18
    networks: [lab-network]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      # Re-enter the official entrypoint so it drops privileges to the redis user.
      - exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    networks: [lab-network]
    logging: *default-logging

  backend:
    image: lab-backend:local
    build:
      context: ./lab-backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: lab_management
      MYSQL_USERNAME: lab_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DATABASE: "0"
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: "true"
      MAIL_SSL: "true"
      SMS_ENABLED: "false"
      UPLOAD_DIR: /app/uploads
      DOCS_ENABLED: "false"
      FLYWAY_ENABLED: "true"
      # MySQL初始化脚本先建立已知8表；仅通过结构预检后接管，未知结构拒绝。
      SCHEMA_ADOPT_EXISTING: ${SCHEMA_ADOPT_EXISTING:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
      BAIDU_AI_ENABLED: ${BAIDU_AI_ENABLED:-false}
      QWEN_AI_ENABLED: ${QWEN_AI_ENABLED:-false}
      QWEN_AI_API_KEY: ${QWEN_AI_API_KEY:-}
      QWEN_AI_ENDPOINT: ${QWEN_AI_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      QWEN_AI_MODEL: ${QWEN_AI_MODEL:-qwen3-vl-plus}
      BAIDU_AI_API_KEY: ${BAIDU_AI_API_KEY:-}
      BAIDU_AI_SECRET_KEY: ${BAIDU_AI_SECRET_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    networks: [lab-network]
    logging: *default-logging

  frontend:
    image: lab-frontend:local
    build:
      context: ./lab-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [lab-network]
    logging: *default-logging

networks:
  lab-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  uploads_data:
