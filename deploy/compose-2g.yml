{
  "services": {
    "mysql": {
      "mem_limit": "512m",
      "mem_reservation": "256m",
      "command": [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+08:00",
        "--innodb-buffer-pool-size=128M",
        "--innodb-log-buffer-size=16M",
        "--max-connections=40",
        "--performance-schema=OFF",
        "--table-open-cache=128",
        "--table-definition-cache=512",
        "--thread-cache-size=8",
        "--tmp-table-size=16M",
        "--max-heap-table-size=16M",
        "--temptable-max-ram=64M",
        "--temptable-max-mmap=64M"
      ]
    },
    "redis": {
      "mem_limit": "160m",
      "mem_reservation": "64m",
      "command": [
        "sh",
        "-ec",
        "exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 64mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""
      ]
    },
    "backend": {
      "mem_limit": "768m",
      "mem_reservation": "256m",
      "cpus": 1.25,
      "environment": {
        "JAVA_TOOL_OPTIONS": "-Xms96m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=48m -Xss512k",
        "DB_POOL_INITIAL_SIZE": "1",
        "DB_POOL_MIN_IDLE": "1",
        "DB_POOL_MAX_ACTIVE": "6",
        "TOMCAT_MAX_THREADS": "24",
        "TOMCAT_MIN_THREADS": "2",
        "TOMCAT_MAX_CONNECTIONS": "128",
        "TOMCAT_ACCEPT_COUNT": "32",
        "REDIS_POOL_MAX_ACTIVE": "8",
        "REDIS_POOL_MAX_IDLE": "4",
        "REDIS_POOL_MIN_IDLE": "1",
        "QWEN_AI_ENABLED": "${QWEN_AI_ENABLED:-false}",
        "QWEN_AI_API_KEY": "${QWEN_AI_API_KEY:-}",
        "QWEN_AI_ENDPOINT": "${QWEN_AI_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}",
        "QWEN_AI_MODEL": "${QWEN_AI_MODEL:-qwen3-vl-plus}",
        "ASSISTANT_ENABLED": "${ASSISTANT_ENABLED:-false}",
        "ASSISTANT_ENDPOINT": "${ASSISTANT_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}",
        "ASSISTANT_API_KEY": "${ASSISTANT_API_KEY:-}",
        "ASSISTANT_MODEL": "${ASSISTANT_MODEL:-qwen-plus}"
      }
    },
    "frontend": {
      "mem_limit": "48m",
      "mem_reservation": "16m",
      "volumes": [
        "${FRONTEND_NGINX_CONFIG:-./deploy/nginx-2g.conf}:/etc/nginx/conf.d/default.conf:ro"
      ]
    }
  }
}
