server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never

spring:
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:true}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    import: optional:file:./.env.local[.properties]
  application:
    name: lab-backend
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 【需修改】主机、端口、用户名、密码；数据库名称对应之前的 SQL。
    # 固定使用 UTC+08:00；数值偏移不依赖 MySQL 命名时区表。
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lab_management}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=GMT%2B08:00&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

  # Spring Boot 2.7 使用 spring.redis。
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    # 【需修改】Redis 设置了密码时填写；无密码保持空字符串。
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    timeout: 5s
    connect-timeout: 5s
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3s

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lab.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端请求头：Authorization: Bearer <token>
  token-name: Authorization
  token-prefix: Bearer
  # 固定有效期7天；关闭闲置失效，避免30分钟未使用就提前退出。
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  is-log: false
  is-print: false

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}
    path: /swagger-ui.html

knife4j:
  enable: ${DOCS_ENABLED:true}
  setting:
    language: zh_cn

app:
  schema:
    # 存量8表库先备份，再显式设为true；仅校验已知结构后建立版本基线。
    adopt-existing: ${SCHEMA_ADOPT_EXISTING:false}
  recovery:
    email-enabled: ${MAIL_ENABLED:false}
    sms-enabled: ${SMS_ENABLED:false}
    sms-provider: ${SMS_PROVIDER:aliyun}
    sms-sign-name: ${SMS_SIGN_NAME:}
    sms-template-code: ${SMS_TEMPLATE_CODE:}
    sms-access-key-id: ${SMS_ACCESS_KEY_ID:}
    sms-access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
  upload:
    # 本地持久化目录；Docker部署时将此目录挂载为数据卷，避免重建容器丢图。
    directory: ${UPLOAD_DIR:./uploads}
  reservation:
    scheduling-enabled: ${RESERVATION_SCHEDULING_ENABLED:true}
    scan-delay-ms: 60000
    scan-initial-delay-ms: 10000
  cors:
    # 【需修改】前端域名变化时调整；多个来源用英文逗号分隔。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    qwen:
      enabled: ${QWEN_AI_ENABLED:false}
      api-key: ${QWEN_AI_API_KEY:}
      endpoint: ${QWEN_AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      model: ${QWEN_AI_MODEL:qwen3-vl-plus}
      connect-timeout-ms: 2000
      read-timeout-ms: 7000
    baidu:
      # 【需修改】使用百度图像识别应用的API Key/Secret Key，开启后有图报修默认调用。
      enabled: ${BAIDU_AI_ENABLED:true}
      api-key: ${BAIDU_AI_API_KEY:}
      secret-key: ${BAIDU_AI_SECRET_KEY:}
      connect-timeout-ms: 2000
      read-timeout-ms: 5000

logging:
  level:
    root: INFO
    com.lab: INFO
    # RestTemplate 的 DEBUG 日志可能输出百度凭证、Token 和图片表单，保持 WARN。
    org.springframework.web.client.RestTemplate: WARN

# 可选文字助手；与百度图片识别独立，密钥仅放后端私有环境。
assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  endpoint: ${ASSISTANT_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  api-key: ${ASSISTANT_API_KEY:}
  model: ${ASSISTANT_MODEL:qwen-plus}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false
